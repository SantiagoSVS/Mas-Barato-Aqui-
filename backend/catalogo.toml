# Catálogo inicial: los productos que el worker captura en cada tienda (sección 5.1).
# Las consultas de los usuarios se responden sobre lo que este catálogo haya capturado.
#
# Cada producto lleva, en [producto.ids], sus identificadores en cada tienda. Las ofertas que
# salen de esos identificadores se vinculan a este producto sin emparejamiento automático.
#
# Mercado Libre: el identificador es el /p/MCO… de la página del producto. Verifícalo antes de
# agregarlo (solo sirven los que tienen publicaciones activas):
#   python -m app.herramientas.buscar_mercadolibre --id MCO12345678
#
# Falabella: el identificador es el número de la dirección /falabella-co/product/73447854/...
# Homecenter: igual, el número de /homecenter-co/product/733184/...
#
# Un producto puede tener varios identificadores en una tienda (varios vendedores).
#
# PENDIENTE: definir el catálogo real. Estos productos se verificaron el 1 de noviembre de
# 2026 y sirven para probar la captura de punta a punta.

